name: release

# 推一个 v 开头的 tag 就出一批发布件,deploy/install.sh 和 deploy/install-cli.sh
# 下载的正是这些文件名 —— 改这里的命名要同步改那两个脚本里的 ARCHIVE。
#
#   git tag -a v0.2.0 -m "这次改了什么"
#   git push origin v0.2.0
#
# 发布说明(changelog)就放在 GitHub 的 Releases 页上,没有单独的 CHANGELOG.md:
# 正文取自注解式 tag 的消息(-a 加 -m),所以请把 tag 消息当成发布说明来写。
# 轻量 tag(git tag v0.2.0,没消息)会退回让 GitHub 按提交标题凑一份。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: tar.gz }
          - { goos: linux, goarch: arm64, ext: tar.gz }
          - { goos: darwin, goarch: amd64, ext: tar.gz }
          - { goos: darwin, goarch: arm64, ext: tar.gz }
          - { goos: windows, goarch: amd64, ext: zip }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        # 版本号必须编进去:自动更新检查靠它判断"我这一版和上游差多少",没注入
        # 的话控制面只能回答"不知道我是哪一版",于是永远提醒不了新版本。
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/RovenEverward/my-proxy/internal/buildinfo.version=${{ github.ref_name }}" \
            -o mpx${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/mpx

      - name: 打包
        run: |
          set -eu
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip -q "mpx_${{ matrix.goos }}_${{ matrix.goarch }}.zip" mpx.exe
          else
            tar -czf "mpx_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" mpx
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mpx_${{ matrix.goos }}_${{ matrix.goarch }}
          path: mpx_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.ext }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tag 消息现在走 GitHub API 取(见下面那步的注释),不再需要完整历史。
          # 保留 0 只是让 checkout 仍落在一个确定的 ref 上。
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # SHA256SUMS 覆盖全部发布件,再用 ed25519 对它整个文件签一次名(64 字节原始签名)。
      # 安装脚本与 internal/release 先验签名、再对哈希,见 docs/internal/update-rfc.md §1。
      # 私钥只在这一步出现在 runner 的临时目录里,用完即删。
      - name: SHA256SUMS 与签名
        env:
          SIGNING_KEY: ${{ secrets.MPX_RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          cd dist
          sha256sum mpx_* > SHA256SUMS
          cat SHA256SUMS
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::没有设 secret MPX_RELEASE_SIGNING_KEY,不发未签名的发布(步骤见 docs/internal/update-rfc.md「M0 上线步骤」)"
            exit 1
          fi
          # 仓库里写的公钥必须正是这把私钥的另一半:否则发出去的签名谁都验不过。
          repo_pub=$(sed -n 's/^MPX_RELEASE_PUBKEY="\(.*\)"$/\1/p' ../deploy/install.sh)
          if [ -z "$repo_pub" ]; then
            echo "::error::deploy/install.sh 里的 MPX_RELEASE_PUBKEY 还是占位"
            exit 1
          fi
          key="$RUNNER_TEMP/release-signing.pem"
          ( umask 077; printf '%s\n' "$SIGNING_KEY" > "$key" )
          trap 'rm -f "$key"' EXIT
          key_pub=$(openssl pkey -in "$key" -pubout | sed '1d;$d' | tr -d '\n')
          if [ "$key_pub" != "$repo_pub" ]; then
            echo "::error::签名私钥与仓库里的公钥不是一对"
            exit 1
          fi
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          printf -- '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----\n' "$repo_pub" > "$RUNNER_TEMP/pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/pub.pem" -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig

      - name: 取出 tag 消息当发布说明
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 注解式 tag(-a)的消息就是这次发布要讲的话。轻量 tag 没有消息,这里会
          # 得到空串,后面退回让 GitHub 按提交标题生成。
          #
          # **必须问 GitHub,不能在本地读**:actions/checkout 会把 refs/tags/<tag>
          # 重写成指向 commit 的**轻量 tag**(日志里能看到它跑的是
          # `fetch ... +<commit-sha>:refs/tags/<tag>`),于是本地那个注解 tag 对象
          # 被顶掉了,`git tag -l --format='%(contents)'` 只剩 commit 消息。
          # v0.3.0 与 v0.3.1 两次发布都是这么丢掉 tag 消息的。
          tag_sha=$(gh api "repos/${{ github.repository }}/git/ref/tags/${{ github.ref_name }}" --jq .object.sha)
          obj_type=$(gh api "repos/${{ github.repository }}/git/ref/tags/${{ github.ref_name }}" --jq .object.type)
          if [ "$obj_type" = "tag" ]; then
            gh api "repos/${{ github.repository }}/git/tags/$tag_sha" --jq .message > NOTES.md
          else
            : > NOTES.md   # 轻量 tag:没有消息,走自动生成那条路
          fi
          if [ -n "$(tr -d '[:space:]' < NOTES.md)" ]; then
            echo "有 tag 消息,用它当发布说明:"
            cat NOTES.md
            echo "annotated=true" >> "$GITHUB_OUTPUT"
          else
            echo "这个 tag 没有消息,退回自动生成的发布说明"
            rm -f NOTES.md
            echo "annotated=false" >> "$GITHUB_OUTPUT"
          fi

      # 两个步骤二选一,而不是把 body_path 与 generate_release_notes 一起给:
      # 同时给时后者会把自动生成的那份**追加**到正文后面,于是人工写的话和凑
      # 出来的提交列表混在一起。分开写,谁生效一目了然。
      #
      # 注明:推 tag 时 GitHub 会先自己建一个 release(正文是自动生成的提交列表),
      # publish job 跑起来时它已经在那儿了,action 于是走"更新已有 release"那条路。
      # v0.3.0 实测正文仍是提交消息 —— body_path 没能覆盖已有的。所以下面用
      # gh release edit 再显式写一次正文,不依赖 action 内部的合并逻辑。
      - name: 用 tag 消息发布
        if: steps.notes.outputs.annotated == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: NOTES.md

      - name: 确保正文就是 tag 消息
        if: steps.notes.outputs.annotated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # action 若没能覆盖预建 release 的正文,这里补上。幂等,已是目标内容
          # 时只是又写一遍同样的字。
          gh release edit "${{ github.ref_name }}" --notes-file NOTES.md
          echo "现在正文开头是:$(gh release view '${{ github.ref_name }}' --json body -q .body | head -1)"

      - name: 用自动生成的说明发布
        if: steps.notes.outputs.annotated != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
