<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
@font-face{font-family:"Mona Sans VF";src:url(../assets/fonts/MonaSansVF.woff2) format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:"Mona Sans Mono VF";src:url(../assets/fonts/MonaSansMonoVF.woff2) format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:"Noto Sans SC";src:url(../assets/fonts/NotoSansSC-subset.woff2) format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+2010-206F,U+2E80-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF}
:root{
  --ui-font-size-display:21px;--ui-font-size-title:15px;--ui-font-size-body:14.5px;
  --ui-font-size-navigation:13.5px;--ui-font-size-control:13.5px;--ui-font-size-caption:12.5px;
  --ui-font-size-meta:11.5px;--ui-line-height-body:1.47;
  --ui-icon-size:16px;--ui-icon-stroke:1.75;--r-card:12px;
  --ui-control-height:32px;--ui-icon-button-size:30px;
  --ease:cubic-bezier(.23,1,.32,1);color-scheme:light;
  --base:#e9e9ec;--canvas:#fff;--panel:#f4f4f6;--stone:#ececef;
  --hover:color-mix(in srgb,var(--ink) 4.5%,transparent);
  --ink:#2F3033;--ink2:#3f3f46;--muted:#71717a;--faint:#a1a1aa;
  --lift:0 2px 6px #0000000d,0 24px 56px -16px #00000038;--ring:color-mix(in srgb,var(--ink) 28%,transparent);

  --ok:#16a34a;--warn:#8F6B00;--warn-ico:#C99700;--bad:#dc2626;--info:#2563eb;--off:#a1a1aa;
  --bad-bg:#fef2f2;--warn-bg:#FDF8E1;
  --sans:"Mona Sans VF",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Noto Sans",Helvetica,Arial,sans-serif;
  --mono:"Mona Sans Mono VF",ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans SC",monospace;
  --font-body:var(--ui-font-size-body);--line-body:var(--ui-line-height-body);--font-control:var(--ui-font-size-control);
  --font-control-sm:var(--ui-font-size-control);--font-status:var(--ui-font-size-navigation);
  --control-height:var(--ui-control-height);--control-height-sm:28px;--control-radius:8px;--icon-button-size:32px;
  --button-primary-bg:var(--ink);--button-primary-text:var(--canvas);
  --ui-toast-bg:rgba(28,25,23,.94);--ui-toast-text:#fafaf9;
}
[data-theme=dark]{color-scheme:dark;--base:#08090a;--canvas:#111214;--panel:#17181b;--stone:#222327;--hover:color-mix(in srgb,var(--ink) 7%,transparent);
  --ink:#DDDEE0;--ink2:#c4c4c8;--muted:#8f8f96;--faint:#5b5d64;--flag-edge:rgba(255,255,255,.22);--ui-border-subtle:rgba(250,249,247,.12);
  --ok:#3fb950;--warn:#D4A72C;--warn-ico:#D4A72C;--bad:#f2555a;--info:#58a6ff;--off:#5b5d64;
  --bad-bg:#2a1214;--warn-bg:#221D0B}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--base);color:var(--ink);font:var(--font-body)/var(--line-body) var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"kern","tnum"}
button,input{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-size:var(--ui-font-size-title)}
code,.mono{font-family:var(--mono);font-size:var(--ui-font-size-meta)}
.bold{font-weight:540}.sub{color:var(--muted);font-size:var(--ui-font-size-caption)}
.c-bad{color:var(--bad)}.mt{margin-top:14px}.mb{margin-bottom:14px}.mt2{margin-top:2px}.mt6{margin-top:6px}.mb14{margin-bottom:14px}.mb8{margin-bottom:8px}
.b6{font-weight:560}.pad16{padding:16px}
.icon{width:var(--ui-icon-size);height:var(--ui-icon-size);flex:none;stroke-width:var(--ui-icon-stroke)}
.flag-w{position:relative;display:inline-flex;vertical-align:-.1em;border-radius:2px;line-height:0}
.flag-w::after{content:"";position:absolute;inset:0;border-radius:2px;box-shadow:inset 0 0 0 1px var(--flag-edge);pointer-events:none}
.flag{height:.9em;width:auto;aspect-ratio:4/3;border-radius:2px;display:block}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh}
.side{overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:14px 10px;background:var(--base)}
.brand{display:flex;align-items:center;gap:9px;height:22px;padding:0 10px;margin-bottom:14px;font-weight:620;font-size:var(--ui-font-size-body)}
.brand svg{height:22px;width:auto}.brand small{margin-left:auto;align-self:flex-start;margin-top:6.5px;font:500 var(--ui-font-size-meta)/1 var(--mono);color:var(--faint)}
.profile{display:flex;align-items:center;gap:8px;margin:0 2px 12px;padding:8px 10px;border-radius:9px;background:var(--canvas);font-size:var(--ui-font-size-control);width:100%;border:0;cursor:pointer}
.profile .pf-t{flex:1;min-width:0;text-align:left}.profile b,.profile span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile b{font-weight:560}.profile span{color:var(--muted);font-family:var(--mono);font-size:var(--ui-font-size-meta)}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:7px;color:var(--ink2);font-weight:470;font-size:var(--ui-font-size-navigation);cursor:pointer}
.nav:hover{background:var(--hover)}.nav.on{background:var(--canvas);color:var(--ink);font-weight:560}
.nav svg{width:16px;height:16px;flex:none;opacity:.75}.nav .ct{margin-left:auto;font:500 var(--ui-font-size-meta) var(--mono);color:var(--faint)}
.nsep{height:14px}
main{min-width:0;margin:8px 8px 8px 0;background:var(--canvas);border-radius:var(--r-card);height:calc(100vh - 16px);overflow-x:hidden;overflow-y:auto}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;height:52px;padding:0 28px;border-radius:var(--r-card) var(--r-card) 0 0;background:var(--canvas)}
.crumb{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:var(--ui-font-size-control)}
.crumb b{color:var(--ink);font-weight:560;font-size:var(--ui-font-size-title)}.crumb i{font-style:normal;color:var(--faint)}
.top .sp{flex:1}.top .sub{font-size:var(--ui-font-size-meta)}
.ib{display:inline-grid;place-items:center;width:var(--icon-button-size);height:var(--icon-button-size);border:0;border-radius:var(--control-radius);background:none;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--hover);color:var(--ink)}.ib svg{width:16px;height:16px}
.page{max-width:1200px;margin:0 auto;padding:28px 28px 80px}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}
.ph h1{margin:0;font-size:var(--ui-font-size-title);font-weight:640;letter-spacing:-.015em}.ph p{margin:4px 0 0;color:var(--muted)}.ph .sp{flex:1}
.card{background:var(--panel);border-radius:var(--r-card)}
.card:has(table){padding:0 6px 6px}
.ch{display:flex;align-items:center;gap:8px;margin:0;padding:14px 16px;font-size:var(--ui-font-size-title);font-weight:600}
.ch .sp{flex:1}.ch small{font-weight:450;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--off);flex:none;display:inline-block}
.dot.ok{background:var(--ink);box-shadow:none}.dot.warn{background:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
.dot.bad{background:var(--bad)}.dot.info{background:none;box-shadow:inset 0 0 0 1.5px var(--muted)}
.st{display:inline-flex;align-items:center;gap:7px;font-size:var(--font-status);white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--stone);color:var(--ink2);font:500 var(--ui-font-size-control) var(--mono)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;text-align:left;font-weight:500;font-size:var(--ui-font-size-caption);color:var(--muted);padding:9px 16px;white-space:nowrap;background:var(--panel)}
td{padding:11px 16px;vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer;transition:background 100ms}tbody tr:hover{background:var(--hover)}
tbody tr td:first-child{border-radius:8px 0 0 8px}tbody tr td:last-child{border-radius:0 8px 8px 0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--warn-bg);font-size:var(--ui-font-size-caption);color:var(--ink2)}
.callout.bad{background:var(--bad-bg)}.callout.stone{background:var(--stone)}.callout b{color:var(--ink)}
.callout svg{flex:none;margin-top:1px;width:16px;height:16px}
.callout .ico-bad{color:var(--bad)}.callout .ico-warn{color:var(--warn-ico)}
.btn{display:inline-flex;align-items:center;gap:6px;height:var(--control-height);padding:0 12px;border:0;border-radius:var(--control-radius);background:var(--stone);font-weight:520;font-size:var(--font-control);cursor:pointer;white-space:nowrap;transition:transform 140ms var(--ease),background 120ms}
.btn:hover{background:var(--hover)}.btn:active{transform:scale(.97)}.btn svg{width:14px;height:14px}
.btn.pri{background:var(--button-primary-bg);color:var(--button-primary-text)}.btn.pri:hover{opacity:.9}
.btn.sm{height:var(--control-height-sm);padding:0 10px;font-size:var(--font-control-sm)}
.btn.busy{position:relative;color:transparent;pointer-events:none}
.btn.busy::after{content:"";position:absolute;inset:0;margin:auto;width:14px;height:14px;border-radius:50%;border:2px solid var(--canvas);border-color:var(--canvas) transparent var(--canvas) var(--canvas);animation:spin .7s linear infinite}
.btn:not(.pri).busy::after{border-color:var(--ink) transparent var(--ink) var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.btn:focus-visible,.ib:focus-visible,.seg button:focus-visible,.lnk:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--stone)}
.seg button{height:26px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--muted);font-size:var(--ui-font-size-control);cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.seg button.on{background:var(--canvas);color:var(--ink);font-weight:540}
.seg .ct{font:500 var(--ui-font-size-meta) var(--mono);color:var(--faint)}
.lnk{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ink) 45%,transparent);text-underline-offset:2px;cursor:pointer;font:inherit}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.28);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity 180ms}
[data-theme=dark] .scrim{background:rgba(0,0,0,.55)}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:31;top:8px;right:8px;bottom:8px;width:440px;max-width:calc(100vw - 16px);display:flex;flex-direction:column;background:var(--canvas);border-radius:var(--r-card);box-shadow:var(--lift);transform:translateX(110%);transition:transform 260ms var(--ease)}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 6px}
.dt h2{margin:0;font-size:var(--ui-font-size-title);font-weight:620}.dt .sub{display:block;margin-top:2px}
.drawer .db{flex:1;overflow:auto;padding:14px 18px 18px}
.drawer .df{display:flex;gap:8px;align-items:center;padding:12px 18px}
.drawer .df .sp{flex:1}
.toast{position:fixed;z-index:40;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--ui-toast-bg);color:var(--ui-toast-text);font-size:var(--ui-font-size-caption);box-shadow:var(--lift)}
.toast svg{width:14px;height:14px}
/* === 原型专属 === */
.px-top{position:sticky;top:0;z-index:70;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--canvas);border-bottom:1px solid var(--ui-border-subtle)}
.px-top b{font-size:var(--ui-font-size-title);font-weight:640}
.px-note{font-size:var(--ui-font-size-caption);color:var(--muted);margin-left:auto}
.px-dir-desc{display:flex;align-items:baseline;gap:10px;padding:12px 18px 0;font-size:var(--ui-font-size-caption);color:var(--muted)}
.px-dir-desc b{color:var(--ink);font-weight:560;white-space:nowrap}
.px-src-head{padding:12px 12px 4px;display:flex;align-items:baseline;gap:10px;font-weight:560}
.px-src-head .sub{font-weight:400}
.px-d-row{display:flex;align-items:center;gap:14px;padding:8px 6px;border-radius:8px;font-size:var(--ui-font-size-body)}
.px-d-row:hover{background:var(--hover)}
.px-d-row .inb{display:flex;align-items:center;gap:8px;min-width:0;width:158px;flex:none}
.px-d-row .ptag{font-size:var(--ui-font-size-caption);padding:0 7px}
.px-d-row .inb b{font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:99px;background:var(--stone);color:var(--ink2);font-size:var(--ui-font-size-control);font-weight:540;white-space:nowrap}
.cx-port{color:var(--ink2);font-size:var(--ui-font-size-meta)}
.px-r{display:flex;align-items:center;gap:6px;min-width:88px;flex:1;justify-content:flex-end}
.px-r .lat{font-family:var(--mono);font-size:var(--ui-font-size-meta);color:var(--muted)}
.px-legend{margin:14px 6px 0;padding-top:10px;border-top:1px solid var(--ui-border-subtle);font-size:var(--ui-font-size-caption);color:var(--muted);line-height:1.6}
.vcell{display:grid;gap:1px;justify-items:start}
.vcell .lat{font-family:var(--mono);font-size:var(--ui-font-size-meta);color:var(--muted)}
.filterbar{display:flex;align-items:center;gap:10px;padding:10px 16px 4px;flex-wrap:wrap}
.row-btns{opacity:0;transition:opacity 100ms}tr:hover .row-btns,.px-d-row:hover .row-btns{opacity:1}
.px-checking{color:var(--muted)}
.px-checking i{animation:spin 1.4s linear infinite;display:inline-flex}
.px-checking i svg{width:13px;height:13px}
.chev{width:14px;height:14px;color:var(--faint);transition:transform 180ms var(--ease)}
tr.expanded .chev{transform:rotate(180deg)}
tr.xrow:hover{background:none}tr.xrow td{cursor:default;padding:0 16px 14px}
.xbody{background:var(--stone);border-radius:10px;padding:10px 12px}
.xbody .px-d-row{padding:7px 6px;font-size:var(--ui-font-size-control)}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{display:none}main{margin:8px}.px-top{padding:8px 12px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

}

 e:{n:"E · 原始",d:"上一轮的 E：双列 + 单个「仅看不通」按钮，作对照。"},
 f:{n:"F · A式分段",d:"E 的列 + A 的筛选。「不通」把境内不通和两边都不通混在一起。"},
 g:{n:"G · 语义分段",d:"筛选项说组合语义：双通 / 境内不通 / 都不通 / 未知，对应不同处置。"},
 h:{n:"H · 不通置顶",d:"问题节点默认排最前，「只看不通」作补充；不依赖筛选也能先看到坏的。"},
 i:{n:"I · 行内展开",d:"点行就地展开两来源×入站明细，筛选→发现→看明细在表里一次完成。"}};
function render(){
  $("#dirDesc").innerHTML=`<b>${DIR_META[state.dir].n}</b><span>${DIR_META[state.dir].d}</span>`;
  const fn={e:pageE,f:pageF,g:pageG,h:pageH,i:pageI}[state.dir];
  $("#page").innerHTML=fn();
  if(state.checking)document.querySelectorAll('[data-act=check]').forEach(b=>b.classList.add("busy"));
}
document.addEventListener("click",e=>{
  const exp=e.target.closest("[data-expand]");
  if(exp&&!e.target.closest("[data-act]")){state.expanded=state.expanded===Number(exp.dataset.expand)?0:Number(exp.dataset.expand);render();return}
  const el=e.target.closest("[data-act],[data-dir],[data-sc],[data-f]");
  if(!el)return;
  if(el.dataset.dir){state.dir=el.dataset.dir;state.filter="all";state.expanded=0;document.querySelectorAll("#dirSeg button").forEach(b=>b.classList.toggle("on",b.dataset.dir===state.dir));render();return}
  if(el.dataset.sc){state.checked=el.dataset.sc==="done";state.filter="all";state.expanded=0;document.querySelectorAll("#scSeg button").forEach(b=>b.classList.toggle("on",b.dataset.sc===el.dataset.sc));render();return}
  if(el.dataset.f){state.filter=el.dataset.f;render();return}
  const act=el.dataset.act;
  if(act==="drawer-close"){closeDrawer();return}
  if(act==="drawer"){e.stopPropagation();openDetail(el.dataset.node);return}
  if(act==="goto-node"){closeDrawer();toast(`原型只到列表：这里会跳到节点 ${el.dataset.node} 的详情页`);return}
  if(act==="check-one"){toast("原型：单台重查沿用同一份明细");return}
  if(act==="check"){
    if(state.checking)return;
    state.checking=true;state.checked=false;state.filter="all";state.expanded=0;render();
    setTimeout(()=>{
      state.checking=false;state.checked=true;
      document.querySelectorAll("#scSeg button").forEach(b=>b.classList.toggle("on",b.dataset.sc==="done"));
      render();toast("5 台节点检查完：2 可达 · 2 不通 · 1 未知");
    },2600);
  }
});
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.innerHTML=`${ic("check")}<span>${msg}</span>`;
  $("#toastRoot").appendChild(t);setTimeout(()=>t.remove(),3200);
}
$("#themeBtn").addEventListener("click",()=>{
  const h=document.documentElement,next=h.dataset.theme==="dark"?"light":"dark";
  h.dataset.theme=next;$("#themeBtn").innerHTML=ic(next==="dark"?"sun":"moon");
});
$("#clockNow").textContent=new Date().toLocaleTimeString("zh-CN",{hour12:false});
render();
</script>
</body>
</html>
