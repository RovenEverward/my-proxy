<!doctype html>
<html lang="zh-CN" data-ui="workspace" data-density="standard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPX 组件目录</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/catalog.css">
<script src="/boot.js"></script>
<script src="/icons.js" defer></script>
<script src="/components.js" defer></script>
<script src="/catalog.js" defer></script>
</head>
<body class="catalog">
<main class="catalog-main">
<header class="catalog-head">
<div><h1>MPX 组件目录</h1><p>使用产品组件、官方图标和同一份 Token。</p></div>
<div class="catalog-tools"><label for="density">界面密度</label><select class="in" id="density"><option value="compact">紧凑</option><option value="standard" selected>标准</option><option value="comfortable">舒适</option></select><button type="button" class="ib" id="catalog-theme" aria-label="切换主题" title="切换主题"></button></div>
</header>
<section aria-labelledby="catalog-controls"><h2 id="catalog-controls">操作与字段</h2><div class="catalog-grid">
<div class="catalog-example" data-example="primary"><h3>主要操作</h3><button type="button" class="btn pri">保存</button><p>一个操作区只突出一个主要动作。</p></div>
<div class="catalog-example" data-example="disabled"><h3>不可用</h3><button type="button" class="btn" disabled>保存</button><p>按钮不可用时保留状态与原因。</p></div>
<div class="catalog-example"><h3>图标操作</h3><button type="button" class="ib" id="catalog-copy" aria-label="复制示例" title="复制示例"></button><p id="catalog-feedback" role="status">图标与点击区域分别定义。</p></div>
<div class="catalog-example"><h3>文本字段</h3><div class="field"><label for="catalog-name">用户名</label><input class="in" id="catalog-name" placeholder="例如 alice" aria-describedby="catalog-name-hint"><span class="h" id="catalog-name-hint">保留明确标签和必要提示。</span></div></div>
<div class="catalog-example"><h3>字段错误</h3><div class="field"><label for="catalog-invalid">示例地址</label><input class="in" id="catalog-invalid" value="example" aria-invalid="true" aria-describedby="catalog-error"><span class="fe" id="catalog-error">地址需要包含协议。</span></div></div>
<div class="catalog-example" data-example="status"><h3>状态</h3><div id="catalog-status" class="catalog-status"></div><p>用文字和形状表达状态。</p></div>
</div></section>
<section aria-labelledby="catalog-content"><h2 id="catalog-content">内容状态</h2><div class="catalog-grid"><div class="catalog-example" data-example="empty" id="catalog-empty"></div><div class="catalog-example" data-example="error" id="catalog-failure"></div><div class="catalog-example"><h3>加载</h3><table aria-label="正在读取列表" aria-busy="true"><tbody id="catalog-skeleton"></tbody></table></div></div></section>
<section aria-labelledby="catalog-icons"><h2 id="catalog-icons">官方图标</h2><p class="catalog-note">Lucide。名称与产品调用一致，几何路径来自固定版本的官方 SVG。</p><div id="catalog-icon-grid" class="catalog-icon-grid"></div></section>
<footer class="catalog-note">复杂表单、抽屉、菜单与草稿恢复通过真实页面测试。此目录仅展示共享基础组件。</footer>
</main>
</body>
</html>
