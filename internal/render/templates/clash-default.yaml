# mpx 的 Clash / Clash.Meta (Mihomo) 订阅默认模板。
#
# 规则源统一使用 MetaCubeX/meta-rules-dat(@meta 二进制 .mrs),与 sing-box 同源。
# 默认采用白名单模式:内网 + 国内直连,保留 5 个高频独立分流组(AI / 流媒体 /
# Telegram / 微软 / 苹果),其余未命中默认走代理;不默认开启广告拦截与杂烩大表。

rule-providers:
