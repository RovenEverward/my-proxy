proxy-groups:
  # 节点名单不再逐个列出 —— include-all-proxies 把订阅里的所有节点自动收进来,
  # 以后加节点不用改这份文件。
  - name: 手动切换
    type: select
    include-all-proxies: true
  - name: 自动选择
    type: url-test
    include-all-proxies: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 全球代理
    type: select
    proxies: [自动选择, 手动切换, DIRECT]
    include-all-proxies: true
  - name: 广告拦截
    type: select
    proxies: [REJECT, DIRECT, 全球代理]
  - name: 本地直连
    type: select
    proxies: [DIRECT, 全球代理]
  - name: 人工智能
    type: select
    proxies: [全球代理, 手动切换, DIRECT]
  - name: 谷歌
    type: select
    proxies: [全球代理, 手动切换, DIRECT]
  - name: 苹果
    type: select
    proxies: [全球代理, 手动切换, DIRECT]
  - name: 微软
