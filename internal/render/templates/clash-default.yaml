# mpx 的 Clash / Clash.Meta 订阅默认模板。
#
# 这是一份完整配置的骨架:proxies 由控制面按用户注入,其余(rule-providers /
# proxy-groups / rules / dns)都写在这里,订阅里原样带出。
# 规则源 128 个,合计约 35 万条,由客户端(mihomo)自己下载更新。
