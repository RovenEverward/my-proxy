proxy-groups:
  # 节点名单不再逐个列出 —— include-all-proxies 把订阅里的所有节点自动收进来,
  # 以后加节点不用改这份文件。
  - name: 手动切换
    type: select
    include-all-proxies: true
  - name: 自动选择
    type: url-test
    include-all-proxies: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 全球代理
    type: select
    proxies: [手动切换, 自动选择, DIRECT]
    include-all-proxies: true
  - name: 本地直连
    type: select
    proxies: [DIRECT, 全球代理]
  - name: AI 服务
    type: select
    proxies: [全球代理, 手动切换, DIRECT]
  - name: 流媒体
    type: select
    proxies: [全球代理, 手动切换, DIRECT]
  - name: Telegram
    type: select
    proxies: [全球代理, 手动切换, DIRECT]
  - name: 微软
    type: select
    proxies: [全球代理, 手动切换, DIRECT]
  - name: 苹果
    type: select
    proxies: [DIRECT, 全球代理, 手动切换]
  - name: 漏网之鱼
    type: select
    proxies: [全球代理, 手动切换, DIRECT]

rules:
  # 一、本地网络与内网地址先直连
  - RULE-SET,private,本地直连
  - RULE-SET,private-ip,本地直连,no-resolve
  # 二、高频独立分流组（AI / 流媒体 / Telegram / 微软 / 苹果）
  - RULE-SET,ai,AI 服务
  - RULE-SET,youtube,流媒体
  - RULE-SET,netflix,流媒体
  - RULE-SET,disney,流媒体
  - RULE-SET,hbo,流媒体
  - RULE-SET,primevideo,流媒体
  - RULE-SET,spotify,流媒体
  - RULE-SET,twitch,流媒体
  - RULE-SET,tiktok,流媒体
  - RULE-SET,telegram,Telegram
  - RULE-SET,telegram-ip,Telegram,no-resolve
  - RULE-SET,microsoft,微软
  - RULE-SET,apple,苹果
  # 三、国内域名、国内游戏 CDN 与国内 IP 直连
  - RULE-SET,cn,本地直连
  - RULE-SET,cn-games,本地直连
  - RULE-SET,cn-ip,本地直连,no-resolve
  - GEOIP,CN,本地直连
  # 四、其余未命中默认走代理（白名单模式）
  - MATCH,漏网之鱼

# 域名嗅探:对只带 IP 的连接(比如 app 自己做 DNS)按 TLS SNI / HTTP Host
# 嗅出真实域名再分流,防止污染 IP 直接落空。
sniffer:
  enable: true
  override-destination: false
  sniff:
    TLS:
      ports: [443]
    HTTP:
      ports: [80]
    QUIC:
      ports: [443]
dns:
  # enable/fake-ip 是 TUN 模式的命脉:不开 enable,mihomo 不接管 DNS,
  # 系统 DNS 在国内解析被墙域名拿到的是污染结果,规则再对也连不通。
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  # 只用纯 IP 解析 DoH 服务器的主机名，避免启动时循环依赖。
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  # 节点域名直连国内 DoH 解析，不依赖尚未连上的代理。
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 国外域名默认经代理用 Cloudflare / Google DoH 解析。
  # 查询从代理出口发出，让结果与出口一致，不向国内 DNS 发送查询。
  # 需要较新的 mihomo，旧版不认这套写法。
  nameserver:
    - 'https://1.1.1.1/dns-query#手动切换'
    - 'https://8.8.8.8/dns-query#手动切换'
  # 国内域名按策略直连国内 DoH，不经代理。
  nameserver-policy:
    geosite:cn,private,apple:
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
  # `*` 在 mihomo 里只匹配一级域名,`+.` 才是多级(含裸域)。
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.market.xiaomi.com'
    - 'localhost.ptlogin2.qq.com'
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
