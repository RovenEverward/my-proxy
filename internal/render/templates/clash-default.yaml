    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs
    path: ./ruleset/private.mrs
  private-ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs
    path: ./ruleset/private-ip.mrs
  ai:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ai-!cn.mrs
    path: ./ruleset/ai.mrs
  youtube:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/youtube.mrs
    path: ./ruleset/youtube.mrs
  netflix:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/netflix.mrs
    path: ./ruleset/netflix.mrs
  disney:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/disney.mrs
