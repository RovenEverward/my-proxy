dns:
  # `*` 在 mihomo 里只匹配一级域名,`+.` 才是多级(含裸域)。
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.market.xiaomi.com'
    - 'localhost.ptlogin2.qq.com'
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
  nameserver-policy:
    geosite:cn,private,apple:
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    +.linux.do: https://xxx.ddd.oaifree.com/query-dns
