    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/hbo.mrs
    path: ./ruleset/hbo.mrs
  primevideo:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/primevideo.mrs
    path: ./ruleset/primevideo.mrs
  spotify:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/spotify.mrs
    path: ./ruleset/spotify.mrs
  twitch:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/twitch.mrs
    path: ./ruleset/twitch.mrs
  tiktok:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/tiktok.mrs
    path: ./ruleset/tiktok.mrs
  telegram:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.mrs
    path: ./ruleset/telegram.mrs
  telegram-ip:
